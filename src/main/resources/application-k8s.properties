# ─── K8s profile overrides ───────────────────────────────────────────────────
# Active when SPRING_PROFILES_ACTIVE=k8s (set in Deployment env vars).

# Disable H2 web console (never expose in a cluster environment)
spring.h2.console.enabled=false

# Quiet SQL logging in prod-like environments
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Actuator — keep health probes on the main port so Kubernetes can reach them
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Graceful shutdown: drain in-flight requests before pod stops
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
