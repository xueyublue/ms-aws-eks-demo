apiVersion: v1
kind: Service
metadata:
  name: todo-app
  namespace: todo-app
  labels:
    app.kubernetes.io/name: ms-aws-eks-demo
  # Annotation tells the AWS Load Balancer Controller to target pods directly
  # (IP mode) instead of NodePort — required for Fargate; recommended for EC2.
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
spec:
  type: ClusterIP
  selector:
    app: todo-app
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
